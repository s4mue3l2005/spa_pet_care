<section class="auth-view">
  <div class="auth-container">
    <img src="/assets/logo.svg" alt="Pet Vacation Center" class="logo">
    <h1 data-i18n="create_account">Crear cuenta</h1>
    
    <form id="register-form" class="auth-form">
      <div class="form-group">
        <label for="name" data-i18n="full_name">Nombre completo</label>
        <input type="text" id="name" required>
      </div>
      
      <div class="form-group">
        <label for="email" data-i18n="email">Correo electrónico</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="form-group">
        <label for="password" data-i18n="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>
      
      <div class="form-group">
        <label for="confirm-password" data-i18n="confirm_password">Confirmar contraseña</label>
        <input type="password" id="confirm-password" required>
      </div>
      
      <button type="submit" class="btn-primary" data-i18n="register">Registrarse</button>
    </form>
    
    <div class="auth-footer">
      <p data-i18n="have_account">¿Ya tienes cuenta?</p>
      <a href="/login" data-link data-i18n="login">Inicia sesión</a>
    </div>
  </div>
</section>
