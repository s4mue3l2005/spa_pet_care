<section class="auth-view">
  <div class="auth-container">
    <img src="/assets/logo.svg" alt="Pet Vacation Center" class="logo">
    <h1 data-i18n="login_title">Centro Vacacional para Mascotas</h1>
    
    <form id="login-form" class="auth-form">
      <div class="form-group">
        <label for="email" data-i18n="email">Correo electrónico</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="form-group">
        <label for="password" data-i18n="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>
      
      <button type="submit" class="btn-primary" data-i18n="login">Iniciar sesión</button>
    </form>
    
    <div class="auth-footer">
      <p data-i18n="no_account">¿No tienes cuenta?</p>
      <a href="/register" data-link data-i18n="register">Regístrate aquí</a>
    </div>
  </div>
</section>
