<section class="dashboard-view">
  <h1 data-i18n="welcome_message">Bienvenido, {{userName}}</h1>
  
  <div class="dashboard-stats">
    <div class="stat-card">
      <div class="stat-icon">🐶</div>
      <div>
        <h3 data-i18n="total_pets">Mascotas registradas</h3>
        <p id="total-pets">0</p>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon">🏨</div>
      <div>
        <h3 data-i18n="active_stays">Estancias activas</h3>
        <p id="active-stays">0</p>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon">📅</div>
      <div>
        <h3 data-i18n="upcoming_stays">Próximas estancias</h3>
        <p id="upcoming-stays">0</p>
      </div>
    </div>
  </div>
  
  <div class="recent-section">
    <h2 data-i18n="recent_stays">Estancias recientes</h2>
    <div id="recent-stays" class="cards-container"></div>
  </div>
</section>
